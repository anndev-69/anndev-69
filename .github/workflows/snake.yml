# Đặt file này tại: .github/workflows/snake.yml
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # chạy 12 tiếng / lần
  workflow_dispatch:         # cho phép bấm chạy tay
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: anndev-69
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#EDE9FE,#C4B5FD,#A78BFA,#7C3AED,#4C1D95
            dist/github-snake-dark.svg?color_snake=#A855F7&color_dots=#161B22,#3B2A6B,#6D28D9,#A855F7,#D8B4FE

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
