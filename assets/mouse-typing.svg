<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="A little mouse hammering away at a glowing keyboard">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7ECF3"/>
      <stop offset="100%" stop-color="#A8B3C4"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3448"/>
      <stop offset="100%" stop-color="#151B28"/>
    </linearGradient>
  </defs>

  <!-- toàn cảnh rung nhẹ theo nhịp gõ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 .5; 0 0; .4 .25; 0 0" dur=".32s" repeatCount="indefinite"/>

    <!-- tia loé mỗi lần nện phím -->
    <g stroke="#F472B6" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)">
      <path d="M13 36 L9 32"><animate attributeName="opacity" values="0;1;0;0" dur=".32s" repeatCount="indefinite"/></path>
      <path d="M51 36 L55 32"><animate attributeName="opacity" values="0;0;1;0" dur=".32s" repeatCount="indefinite"/></path>
    </g>

    <!-- đuôi ngoe nguẩy -->
    <path fill="none" stroke="#A8B3C4" stroke-width="2.4" stroke-linecap="round"
      d="M45 30 q9 2 8 9">
      <animate attributeName="d"
        values="M45 30 q9 2 8 9; M45 30 q11 -1 7 8; M45 30 q9 2 8 9"
        dur="1.1s" repeatCount="indefinite"/>
    </path>

    <!-- tai -->
    <circle cx="22" cy="16" r="6.5" fill="url(#fur)"/>
    <circle cx="22" cy="16" r="3.2" fill="#F472B6" opacity=".85"/>
    <circle cx="42" cy="16" r="6.5" fill="url(#fur)"/>
    <circle cx="42" cy="16" r="3.2" fill="#F472B6" opacity=".85"/>

    <!-- thân -->
    <ellipse cx="32" cy="27" rx="13.5" ry="11.5" fill="url(#fur)"/>

    <!-- mắt: chớp -->
    <g fill="#0D1117">
      <ellipse cx="27" cy="25" rx="1.9" ry="2.2">
        <animate attributeName="ry" values="2.2;2.2;.3;2.2;2.2" dur="2.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="37" cy="25" rx="1.9" ry="2.2">
        <animate attributeName="ry" values="2.2;2.2;.3;2.2;2.2" dur="2.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <ellipse cx="32" cy="30.5" rx="2.1" ry="1.6" fill="#F472B6"/>
    <g stroke="#8B95A6" stroke-width=".9" stroke-linecap="round">
      <path d="M29 31 L21 29.5"/><path d="M29 32.5 L21.5 33"/>
      <path d="M35 31 L43 29.5"/><path d="M35 32.5 L42.5 33"/>
    </g>

    <!-- bàn phím -->
    <rect x="7" y="39" width="50" height="15" rx="3.5" fill="url(#board)" stroke="#22D3EE" stroke-width="1.4"/>
    <g fill="#22D3EE" opacity=".55">
      <rect x="10.5" y="42" width="5" height="3.6" rx="1"/>
      <rect x="17.5" y="42" width="5" height="3.6" rx="1"/>
      <rect x="24.5" y="42" width="5" height="3.6" rx="1"/>
      <rect x="31.5" y="42" width="5" height="3.6" rx="1"/>
      <rect x="38.5" y="42" width="5" height="3.6" rx="1"/>
      <rect x="45.5" y="42" width="5" height="3.6" rx="1"/>
      <rect x="10.5" y="47.5" width="12" height="3.6" rx="1"/>
      <rect x="24.5" y="47.5" width="15" height="3.6" rx="1"/>
      <rect x="41.5" y="47.5" width="9" height="3.6" rx="1"/>
    </g>
    <!-- phím sáng chạy qua lại -->
    <rect y="42" width="5" height="3.6" rx="1" fill="#A855F7" filter="url(#glow)">
      <animate attributeName="x" values="10.5;31.5;17.5;45.5;24.5;10.5" dur="1.28s" repeatCount="indefinite"/>
    </rect>

    <!-- hai tay nện phím so le -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 4.5; 0 0" dur=".32s" repeatCount="indefinite"/>
      <ellipse cx="21" cy="36" rx="4.2" ry="3.4" fill="url(#fur)" stroke="#5A6577" stroke-width=".9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 4.5; 0 0" dur=".32s" begin="-.16s" repeatCount="indefinite"/>
      <ellipse cx="43" cy="36" rx="4.2" ry="3.4" fill="url(#fur)" stroke="#5A6577" stroke-width=".9"/>
    </g>
  </g>
</svg>
