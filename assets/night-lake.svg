<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="A chill night by the lake: full moon over rippling water with fish, and a person on a pier working on a MacBook while smoking.">
<defs>
  <!-- ░ Sky ░ -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#05060f"/>
    <stop offset="0.45" stop-color="#0a1030"/>
    <stop offset="0.78" stop-color="#161a4a"/>
    <stop offset="1"   stop-color="#1d1a53"/>
  </linearGradient>
  <!-- ░ Water ░ -->
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#141a52"/>
    <stop offset="0.35" stop-color="#0b1236"/>
    <stop offset="1"   stop-color="#04060f"/>
  </linearGradient>
  <!-- ░ Moon glow ░ -->
  <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0"    stop-color="#d9ecff" stop-opacity="0.9"/>
    <stop offset="0.25" stop-color="#8fd6ff" stop-opacity="0.45"/>
    <stop offset="0.6"  stop-color="#22d3ee" stop-opacity="0.12"/>
    <stop offset="1"    stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonBody" cx="38%" cy="34%" r="70%">
    <stop offset="0"   stop-color="#ffffff"/>
    <stop offset="0.6" stop-color="#e6f2ff"/>
    <stop offset="1"   stop-color="#a9c7ee"/>
  </radialGradient>
  <!-- ░ Moon reflection on water ░ -->
  <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#cfe6ff" stop-opacity="0.55"/>
    <stop offset="1"   stop-color="#cfe6ff" stop-opacity="0"/>
  </linearGradient>
  <!-- ░ Laptop screen glow ░ -->
  <radialGradient id="screen" cx="50%" cy="50%" r="50%">
    <stop offset="0"   stop-color="#bfe9ff" stop-opacity="0.95"/>
    <stop offset="0.5" stop-color="#63c8ff" stop-opacity="0.35"/>
    <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <!-- ░ Warm lantern glow ░ -->
  <radialGradient id="lantern" cx="50%" cy="45%" r="50%">
    <stop offset="0"   stop-color="#ffe0ab" stop-opacity="0.95"/>
    <stop offset="0.5" stop-color="#ff9d4d" stop-opacity="0.4"/>
    <stop offset="1"   stop-color="#ff7a3d" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="softer"><feGaussianBlur stdDeviation="5"/></filter>

  <style>
    .tw  { animation: tw 3.4s ease-in-out infinite; }
    .tw2 { animation: tw 4.6s ease-in-out infinite; }
    .tw3 { animation: tw 2.6s ease-in-out infinite; }
    @keyframes tw { 0%,100%{opacity:.25} 50%{opacity:1} }

    .glow  { animation: glow 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes glow { 0%,100%{opacity:.85; transform:scale(1)} 50%{opacity:1; transform:scale(1.06)} }

    .cloud { animation: drift 60s linear infinite; }
    .cloud2{ animation: drift 90s linear infinite; }
    @keyframes drift { from{transform:translateX(-140px)} to{transform:translateX(1340px)} }

    .refl  { animation: refl 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes refl { 0%,100%{opacity:.5; transform:scaleX(1)} 50%{opacity:.9; transform:scaleX(1.25)} }

    .rip   { animation: rip 5s ease-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes rip { 0%{transform:scale(.2); opacity:.65} 100%{transform:scale(1.6); opacity:0} }

    .swimA { animation: swimA 26s linear infinite; }
    @keyframes swimA { from{transform:translateX(-120px)} to{transform:translateX(1320px)} }
    .swimB { animation: swimB 34s linear infinite; }
    @keyframes swimB { from{transform:translateX(1320px)} to{transform:translateX(-120px)} }
    .bob   { animation: bob 6s ease-in-out infinite; transform-box:fill-box; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(7px)} }
    .bob2  { animation: bob 8s ease-in-out infinite; transform-box:fill-box; }

    .jump  { animation: jump 9s ease-in-out infinite; transform-box:fill-box; }
    @keyframes jump {
      0%,58%   { transform:translateY(70px); opacity:0 }
      66%      { opacity:1 }
      72%      { transform:translateY(-26px) rotate(-12deg); opacity:1 }
      82%      { transform:translateY(4px) rotate(14deg); opacity:1 }
      90%,100% { transform:translateY(70px); opacity:0 }
    }

    .smoke { animation: smoke 6s ease-in-out infinite; transform-box:fill-box; }
    .smoke2{ animation: smoke 6s ease-in-out infinite 3s; transform-box:fill-box; }
    @keyframes smoke { 0%{transform:translateY(0) scale(.6); opacity:0} 20%{opacity:.5} 100%{transform:translateY(-46px) scale(1.5); opacity:0} }

    .ember { animation: ember 3s ease-in-out infinite; }
    @keyframes ember { 0%,100%{opacity:.55} 50%{opacity:1} }

    .flick { animation: flick 7s ease-in-out infinite; }
    @keyframes flick { 0%,100%{opacity:.9} 45%{opacity:1} 55%{opacity:.78} 70%{opacity:.96} }

    .rock { animation: rock 7s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 78%; }
    @keyframes rock { 0%,100%{transform:translateY(0) rotate(-1.6deg)} 50%{transform:translateY(5px) rotate(1.6deg)} }

    .fly  { animation: fly 11s ease-in-out infinite; transform-box:fill-box; }
    .fly2 { animation: fly 14s ease-in-out infinite 2s; transform-box:fill-box; }
    .fly3 { animation: fly 9s  ease-in-out infinite 5s; transform-box:fill-box; }
    @keyframes fly {
      0%   {transform:translate(0,0);   opacity:0}
      25%  {opacity:1}
      50%  {transform:translate(26px,-18px)}
      75%  {opacity:1}
      100% {transform:translate(48px,6px); opacity:0}
    }
  </style>
</defs>

<!-- ══ SKY ══ -->
<rect width="1200" height="235" fill="url(#sky)"/>

<!-- stars -->
<g fill="#ffffff">
  <circle class="tw"  cx="70"  cy="40"  r="1.4"/>
  <circle class="tw2" cx="130" cy="90"  r="1"/>
  <circle class="tw3" cx="180" cy="30"  r="1.3"/>
  <circle class="tw"  cx="360" cy="55"  r="1.1"/>
  <circle class="tw2" cx="430" cy="28"  r="1.5"/>
  <circle class="tw3" cx="500" cy="70"  r="1"/>
  <circle class="tw"  cx="560" cy="38"  r="1.3"/>
  <circle class="tw2" cx="640" cy="60"  r="1.1"/>
  <circle class="tw3" cx="700" cy="26"  r="1.4"/>
  <circle class="tw"  cx="760" cy="52"  r="1"/>
  <circle class="tw2" cx="820" cy="34"  r="1.3"/>
  <circle class="tw3" cx="890" cy="66"  r="1.2"/>
  <circle class="tw"  cx="950" cy="30"  r="1.5"/>
  <circle class="tw2" cx="1010" cy="58" r="1"/>
  <circle class="tw3" cx="1080" cy="36" r="1.3"/>
  <circle class="tw"  cx="1140" cy="72" r="1.1"/>
  <circle class="tw2" cx="1170" cy="24" r="1.2"/>
  <circle class="tw3" cx="40"  cy="120" r="1"/>
  <circle class="tw"  cx="300" cy="110" r="1.1"/>
  <circle class="tw2" cx="600" cy="105" r="1"/>
  <circle class="tw3" cx="980" cy="118" r="1.1"/>
  <circle class="tw"  cx="1130" cy="130" r="1"/>
  <circle class="tw2" cx="240" cy="150" r="0.9"/>
  <circle class="tw3" cx="720" cy="150" r="0.9"/>
</g>

<!-- moon -->
<g>
  <circle class="glow" cx="250" cy="95" r="120" fill="url(#moonGlow)"/>
  <circle cx="250" cy="95" r="46" fill="url(#moonBody)"/>
  <circle cx="268" cy="80" r="8"  fill="#c8d9f2" opacity="0.5"/>
  <circle cx="238" cy="108" r="6" fill="#c8d9f2" opacity="0.45"/>
  <circle cx="258" cy="112" r="4" fill="#c8d9f2" opacity="0.4"/>
</g>

<!-- soft clouds -->
<g opacity="0.28" fill="#6f7bd6">
  <g class="cloud"><ellipse cx="150" cy="150" rx="90" ry="14" filter="url(#softer)"/></g>
  <g class="cloud2"><ellipse cx="500" cy="185" rx="120" ry="16" filter="url(#softer)"/></g>
</g>

<!-- distant hills -->
<path d="M0,235 Q200,195 430,225 T860,215 T1200,232 L1200,235 Z" fill="#0e1338" opacity="0.9"/>
<path d="M0,235 Q320,210 640,232 T1200,222 L1200,235 Z" fill="#080b24"/>

<!-- ══ WATER ══ -->
<rect y="235" width="1200" height="185" fill="url(#water)"/>

<!-- moon reflection: broken shimmering glints on the water -->
<g>
  <rect x="242" y="240" width="16" height="150" rx="8" fill="#9fd0ff" opacity="0.07" filter="url(#softer)"/>
  <g fill="#cfe6ff" filter="url(#soft)">
    <rect class="refl" x="231" y="247" width="26" height="2.6" rx="1.3" opacity="0.5"  style="animation-delay:0s"/>
    <rect class="refl" x="223" y="259" width="18" height="2.4" rx="1.2" opacity="0.3"  style="animation-delay:1.2s"/>
    <rect class="refl" x="235" y="271" width="34" height="2.6" rx="1.3" opacity="0.42" style="animation-delay:0.5s"/>
    <rect class="refl" x="217" y="285" width="22" height="2.4" rx="1.2" opacity="0.26" style="animation-delay:2.1s"/>
    <rect class="refl" x="224" y="299" width="44" height="2.6" rx="1.3" opacity="0.36" style="animation-delay:0.9s"/>
    <rect class="refl" x="220" y="315" width="28" height="2.4" rx="1.2" opacity="0.22" style="animation-delay:1.7s"/>
    <rect class="refl" x="224" y="331" width="52" height="2.8" rx="1.4" opacity="0.3"  style="animation-delay:0.3s"/>
    <rect class="refl" x="205" y="349" width="34" height="2.4" rx="1.2" opacity="0.19" style="animation-delay:2.4s"/>
    <rect class="refl" x="214" y="367" width="60" height="2.8" rx="1.4" opacity="0.22" style="animation-delay:1.1s"/>
    <rect class="refl" x="216" y="387" width="40" height="2.4" rx="1.2" opacity="0.15" style="animation-delay:1.9s"/>
    <rect class="refl" x="215" y="405" width="70" height="3"   rx="1.5" opacity="0.13" style="animation-delay:0.7s"/>
  </g>
</g>

<!-- ripples -->
<g stroke="#7fd4ff" fill="none" stroke-width="1.4">
  <g transform="translate(430,300)"><ellipse class="rip" rx="34" ry="9" style="animation-delay:0s"/></g>
  <g transform="translate(650,350)"><ellipse class="rip" rx="40" ry="11" style="animation-delay:1.6s"/></g>
  <g transform="translate(900,315)"><ellipse class="rip" rx="30" ry="8" style="animation-delay:3.1s"/></g>
  <g transform="translate(320,375)"><ellipse class="rip" rx="44" ry="12" style="animation-delay:2.3s"/></g>
</g>

<!-- fish (underwater silhouettes) -->
<g opacity="0.85">
  <g class="swimA">
    <g transform="translate(0,300)"><g class="bob">
      <path d="M0,0 q14,-9 30,0 q-14,9 -30,0 Z" fill="#0e2740"/>
      <path d="M30,0 l12,-7 0,14 Z" fill="#0e2740"/>
      <circle cx="8" cy="-1.5" r="1.3" fill="#7fd4ff"/>
      <path d="M0,-2 q14,-6 28,-1" stroke="#3f9fd6" stroke-width="1" fill="none" opacity="0.7"/>
    </g></g>
  </g>
  <g class="swimB">
    <g transform="translate(0,355) scale(0.8)"><g class="bob2">
      <path d="M0,0 q14,-9 30,0 q-14,9 -30,0 Z" fill="#123049"/>
      <path d="M30,0 l12,-7 0,14 Z" fill="#123049"/>
      <circle cx="8" cy="-1.5" r="1.4" fill="#a855f7"/>
    </g></g>
  </g>
  <g class="swimA" style="animation-duration:40s;animation-delay:6s">
    <g transform="translate(0,388) scale(0.65)"><g class="bob">
      <path d="M0,0 q14,-9 30,0 q-14,9 -30,0 Z" fill="#0c2338"/>
      <path d="M30,0 l12,-7 0,14 Z" fill="#0c2338"/>
    </g></g>
  </g>
</g>

<!-- jumping fish near the reflection -->
<g transform="translate(470,300)">
  <g class="jump">
    <path d="M0,0 q10,-7 22,0 q-10,7 -22,0 Z" fill="#bfe9ff"/>
    <path d="M22,0 l9,-6 0,12 Z" fill="#bfe9ff"/>
    <circle cx="6" cy="-1" r="1" fill="#0a1030"/>
  </g>
</g>

<!-- ══ LITTLE BOAT on the water (right) ══ -->
<g transform="translate(884,300)">
  <!-- warm lantern glow pooled on the water -->
  <ellipse cx="4" cy="6" rx="74" ry="18" fill="url(#lantern)" class="flick"/>
  <!-- faint reflection of the hull -->
  <path d="M-58,10 Q0,24 58,8 Q0,32 -58,10 Z" fill="#0a1626" opacity="0.4" filter="url(#soft)"/>

  <g class="rock">
    <!-- hull -->
    <path d="M-64,-4 Q0,17 64,-7 L57,-13 Q0,3 -57,-11 Z" fill="#06070f"/>
    <!-- gunwale rim light (moon side) -->
    <path d="M-57,-11 Q0,3 57,-13" fill="none" stroke="#7fd4ff" stroke-width="1.3" opacity="0.5" stroke-linecap="round"/>
    <!-- thwarts (seats) -->
    <path d="M-22,-7 L-20,-2" stroke="#1b2333" stroke-width="3" stroke-linecap="round"/>
    <path d="M22,-9 L24,-4" stroke="#1b2333" stroke-width="3" stroke-linecap="round"/>
    <!-- cat, sitting on the thwart — moon-gazing while it fishes -->
    <g transform="translate(2,2)">
      <!-- fishing rod + line dropping into the water -->
      <path d="M-7,-16 L-48,-38" stroke="#2a3350" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-48,-38 L-45,9" stroke="#6f8cc0" stroke-width="0.8" opacity="0.7"/>
      <ellipse cx="-45" cy="9" rx="4" ry="1.5" fill="none" stroke="#7fd4ff" stroke-width="0.8" opacity="0.55"/>
      <circle cx="-45" cy="7" r="1.4" fill="#cfe6ff"/>
      <!-- body (facing the moon, chin lifted) -->
      <path d="M-8,-10 L-9,-23 Q-11,-28 -16,-30 Q-21,-31 -19,-34 Q-17,-42 -14,-40 L-16,-47 L-11,-40 L-8,-45 L-5,-39 Q0,-34 4,-31 Q14,-30 20,-25 Q25,-20 23,-11 L20,-10 Z" fill="#05060d"/>
      <!-- tail curling to the front -->
      <path d="M21,-14 Q33,-10 25,-3 Q18,1 11,-3 Q7,-6 11,-9 Q16,-12 21,-14 Z" fill="#05060d"/>
      <!-- moon-side rim light -->
      <g fill="none" stroke="#7fd4ff" stroke-width="1" opacity="0.5" stroke-linecap="round">
        <path d="M-19,-34 Q-17,-42 -14,-40"/>
        <path d="M-16,-30 Q-11,-28 -9,-23"/>
      </g>
      <!-- eye glint catching the moonlight -->
      <circle cx="-13.5" cy="-35" r="0.9" fill="#bfe9ff"/>
    </g>
    <!-- lantern on a post at the bow -->
    <path d="M46,-9 L46,-44" stroke="#0d1120" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M39,-44 L53,-44" stroke="#0d1120" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="46" cy="-36" rx="12" ry="12" fill="url(#lantern)" class="flick"/>
    <rect x="42" y="-42" width="8" height="12" rx="2.5" fill="#ffcf87" class="ember"/>
  </g>
</g>

<!-- fireflies -->
<g fill="#c9ff8f">
  <g transform="translate(1030,250)"><circle class="fly"  r="1.8" filter="url(#soft)"/></g>
  <g transform="translate(760,270)"><circle class="fly2" r="1.6" filter="url(#soft)"/></g>
  <g transform="translate(1120,235)"><circle class="fly3" r="2" filter="url(#soft)"/></g>
</g>

<!-- wordmark -->
<g text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <text x="600" y="398" fill="#22d3ee" font-size="23" font-weight="700" letter-spacing="11" opacity="0.25" filter="url(#soft)">ANN-DEV</text>
  <text x="600" y="398" fill="#e8f3ff" font-size="23" font-weight="700" letter-spacing="11" opacity="0.92">ANN-DEV</text>
  <text x="600" y="414" fill="#8fb8dd" font-size="9.5" font-weight="500" letter-spacing="5.5" opacity="0.7">FULL-STACK &#183; AUTOMATION &#183; SHOPIFY</text>
</g>

<!-- foreground reeds -->
<g stroke="#05070f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
  <path d="M40,420 C42,380 34,360 44,336"/>
  <path d="M60,420 C58,388 66,368 56,344"/>
  <path d="M1185,420 C1188,384 1180,364 1190,340"/>
</g>
</svg>
